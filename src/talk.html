<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>AI 生图提示词工程 · HiLoki.ai</title>
    <style>
      :root { color-scheme: dark; font-family: "LXGW WenKai TC", "Songti SC", serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #eadcc9; background: linear-gradient(145deg, #0d0b0a, #281811); }
      main { width: min(720px, 100%); padding: clamp(32px, 8vw, 72px); border: 10px solid #36251d; background: #231913; box-shadow: 0 30px 90px rgba(0,0,0,.5); transform: rotate(-.4deg); }
      small { color: #d3a353; letter-spacing: .22em; }
      h1 { margin: 18px 0; font-size: clamp(40px, 9vw, 76px); line-height: 1; }
      p { color: #b7a592; line-height: 1.9; }
      a { display: inline-block; margin-top: 24px; padding: 12px 18px; color: #fff7ec; background: #b85f3f; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <small>PRESS CALL · ROUTE PRESERVED</small>
      <h1>这张通告<br />正在重新装订</h1>
      <p>分享入口已经在新站保留。完整交互讲稿和下载资源体积较大，将在下一阶段独立迁入，不与首页 MVP 混装。</p>
      <a href="/#press">返回通告栏</a>
    </main>
  </body>
</html>
